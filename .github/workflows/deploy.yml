# Builds the app and publishes it to GitHub Pages at https://samkiller222.github.io/ticket/
# One-time setup: Settings > Pages > Source: "GitHub Actions".
# The Supabase URL and publishable key are public by design (they ship in the page), so they live here, not in secrets.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/modest-gates-gt3jfe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: https://dhpxlmksyctpafcfdpit.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_n4l1GXpuXTM0YqmvRx0FtQ_xIL2y7rc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
